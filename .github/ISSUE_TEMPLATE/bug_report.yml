name: Bug report
description: Report a reproducible library, build or package failure
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, compiler and package manager
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected behavior and actual result
      description: Include a minimal example and redacted logs. Do not include tokens or private content.
    validations:
      required: true
