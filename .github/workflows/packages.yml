name: packages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  conan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shared: ['False', 'True']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: python -m pip install 'conan==2.33.0'
      - run: conan profile detect
      - name: Package and test consumer
        env:
          SHARED: ${{ matrix.shared }}
        run: conan create . --build=missing -s compiler.cppstd=20 -o "&:shared=$SHARED" -c tools.cmake.cmaketoolchain:generator=Ninja -c tools.build:jobs=2
  vcpkg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python scripts/make_vcpkg_overlay.py
      - name: Install overlay and test consumer
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install yl-discord-cpp:x64-linux --overlay-ports="$PWD/build/vcpkg-overlay"
          cmake -S tests/consumer -B build/vcpkg-consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-linux
          cmake --build build/vcpkg-consumer
          build/vcpkg-consumer/consumer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vcpkg-overlay
          path: build/dist/*vcpkg-overlay.zip
          if-no-files-found: error
  msys2:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW64
            arch: mingw64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            arch: ucrt64
            prefix: mingw-w64-ucrt-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git base-devel ${{ matrix.prefix }}-gcc ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja ${{ matrix.prefix }}-asio ${{ matrix.prefix }}-python
      - run: python scripts/make_msys2_recipe.py
      - name: Build and install package
        env:
          MINGW_ARCH: ${{ matrix.arch }}
        run: |
          cd build/msys2/mingw-w64-yl-discord-cpp
          makepkg-mingw --syncdeps --cleanbuild --force --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
      - name: Installed consumer
        run: |
          cmake -S tests/consumer -B build/msys2-consumer -G Ninja
          cmake --build build/msys2-consumer
          build/msys2-consumer/consumer.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: msys2-${{ matrix.msystem }}
          path: build/msys2/mingw-w64-yl-discord-cpp/*.pkg.tar.zst
          if-no-files-found: error
