name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -p test_release.py -v
      - run: python scripts/package_source.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source
          path: build/dist/*
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        shared: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
          SHARED: ${{ matrix.shared }}
        run: cmake --preset default -DBUILD_SHARED_LIBS="$SHARED"
      - run: cmake --build --preset default --parallel 2
      - run: ctest --preset default
      - run: build/default/yl_offline_bot && build/default/yl_class_bot
      - name: Relocated installed consumer
        run: |
          cmake --install build/default --prefix "$RUNNER_TEMP/install"
          mv "$RUNNER_TEMP/install" "$RUNNER_TEMP/relocated"
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/relocated" \
            -DYL_DISCORD_ASIO_INCLUDE_DIR="$GITHUB_WORKSPACE/build/default/_deps/yl_asio-src/asio/include"
          cmake --build build/consumer
          build/consumer/consumer
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shared: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Configure
        env:
          SHARED: ${{ matrix.shared }}
        run: cmake -S . -B build/native -A x64 "-DBUILD_SHARED_LIBS=$env:SHARED"
      - run: cmake --build build/native --config Release --parallel 2
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Relocated installed consumer
        run: |
          cmake --install build/native --config Release --prefix "$env:RUNNER_TEMP/install"
          Move-Item -LiteralPath "$env:RUNNER_TEMP/install" -Destination "$env:RUNNER_TEMP/relocated"
          cmake -S tests/consumer -B build/consumer -A x64 "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/relocated" "-DYL_DISCORD_ASIO_INCLUDE_DIR=$env:GITHUB_WORKSPACE/build/native/_deps/yl_asio-src/asio/include"
          cmake --build build/consumer --config Release --parallel 2
          $env:PATH = "$env:RUNNER_TEMP/relocated/bin;$env:PATH"
          & ./build/consumer/Release/consumer.exe
          exit $LASTEXITCODE
  windows-mingw:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-asio
      - run: cmake --preset default -DBUILD_SHARED_LIBS=ON -DYL_DISCORD_FETCH_ASIO=OFF
      - run: cmake --build --preset default --parallel 2
      - run: ctest --preset default
      - name: Installed consumer
        run: |
          cmake --install build/default --prefix "$PWD/build/install"
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer
          export PATH="$PWD/build/install/bin:$PATH"
          build/consumer/consumer.exe
